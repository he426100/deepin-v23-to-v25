# Default configuration for deepin-v23-to-v25.
# Bash syntax: this file is sourced by the tool. Override values in
# /etc/deepin-v23-to-v25.conf or pass --config FILE.
# Never put a passphrase in this file.

# ---------------------------------------------------------------- backup ----
# Required for "backup". Use a mounted disk, not a directory on the root
# filesystem. The tool refuses the root filesystem unless explicitly allowed.
BACKUP_DEST=""

# "auto" = every regular login user (UID >= 1000, real shell, existing home).
# Or a space-separated list, e.g. "alice bob".
BACKUP_USERS="auto"

# Extra absolute paths or files, in addition to the per-user common paths.
# Paths inside a user's home are archived with that user; other paths go to
# the optional system archive (restore with --system).
BACKUP_EXTRA_PATHS=()

# Extra tar exclude patterns, matched against path components.
BACKUP_EXTRA_EXCLUDES=()

# Optional but large: Downloads, Music/Videos, VM/ISO images.
BACKUP_INCLUDE_DOWNLOADS=0
BACKUP_INCLUDE_MEDIA=0
BACKUP_INCLUDE_DISK_IMAGES=0

# WeChat data is excluded by default (the chat history is not backed up).
WECHAT_BACKUP=0

# gzip is available on every Deepin installation, so a restore never depends
# on extra tools. Set to zstd if you prefer speed and have zstd installed.
BACKUP_COMPRESS="gzip"

# Split archives larger than this. Keep below 4 GiB for FAT32 USB disks.
BACKUP_SPLIT_MB=3500

# Read the archives back after writing (recommended).
BACKUP_VERIFY=1

# Encrypt private keys, shell dotfiles/history, app credentials and .env files.
# Plain archives exclude these paths. Strongly recommended.
ENCRYPT_SECRETS=1

# Optional file containing the encryption passphrase (mode 0600).
# If empty, the tool asks twice and keeps the passphrase only in memory.
SECRETS_PASSPHRASE_FILE=""

# Put ~/.config into the encrypted archive. Many apps store tokens there.
# Set to 0 only if you accept that risk.
SECRETS_INCLUDE_CONFIG=1

# Refuse to create plaintext secret archives unless this is explicitly 1.
ALLOW_UNENCRYPTED_SECRETS=0

# Allow BACKUP_DEST on the same filesystem as /. Not useful for disaster
# recovery; only enable for tests.
ALLOW_SAME_FS_BACKUP=0

# Run executable scripts from hooks/backup-pre.d and hooks/backup-post.d.
BACKUP_HOOKS=1

# --------------------------------------------------------------- upgrade ----
DEEPIN_SUITE="crimson"
DEEPIN_COMPONENTS="main commercial community"

# Tried in order; the first one whose dists/crimson/InRelease is reachable wins.
DEEPIN_MIRRORS=(
  "https://mirrors.aliyun.com/deepin/beige/"
  "https://mirrors.tuna.tsinghua.edu.cn/deepin/beige/"
  "https://cdn-community-packages.deepin.com/beige/"
)

APPSTORE_ENABLED=1
APPSTORE_SOURCE="deb https://com-store-packages.uniontech.com/appstore-V25 crimson appstore"

# The driver repository is optional and can break apt on unsupported hardware.
DRIVER_REPO_ENABLED=0
DRIVER_SOURCE="deb https://cdn-community-packages.deepin.com/driver-25/ snipe non-free"

# GRUB menu timeout used during the upgrade so an old kernel stays selectable.
GRUB_TIMEOUT=5

# Keep journald logs across the upgrade so a broken first boot is diagnosable.
ENABLE_PERSISTENT_JOURNAL=1

# Required desktop stack. The tool installs missing packages after the upgrade.
DESKTOP_PACKAGES=(dde-shell dde-session dde-session-shell lightdm)
# Recommended packages. Failures are reported but do not abort the upgrade.
DESKTOP_EXTRA_PACKAGES=(dde-kwin dde-appearance xdg-desktop-portal-dde)

# Services stopped before apt runs.
STOP_SERVICES=(lightdm unattended-upgrades packagekit)

# Start Docker again after the upgrade and restart containers that were running
# before it (the list is recorded in the pre-upgrade state).
DOCKER_RESTORE=1

AUTO_REBOOT=0

# ----------------------------------------------------------- post/dock ----
# Set to 1 to restart the graphical session automatically after "post".
# Kept off by default: it closes every open application.
RESTART_SESSION_ON_POST=0
